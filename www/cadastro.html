<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro — Receitas em Casa</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="card">
    <h1>🍲 Receitas em Casa</h1>
    <p class="subtitle">Crie sua conta gratuita</p>

    <!-- Tela simulada: não há cadastro real. O botão navega direto
         para a página inicial, como se a conta já tivesse sido criada -->
    <label for="nome">Nome</label>
    <input type="text" id="nome" placeholder="Seu nome">

    <label for="email">E-mail</label>
    <input type="email" id="email" placeholder="seuemail@exemplo.com">

    <label for="senha">Senha</label>
    <input type="password" id="senha" placeholder="Crie uma senha">

    <label for="confirmarSenha">Confirmar senha</label>
    <input type="password" id="confirmarSenha" placeholder="Repita a senha">

    <div class="checkboxes">
      <label><input type="checkbox" id="vegetariano"> Vegetariano</label>
      <label><input type="checkbox" id="vegano"> Vegano</label>
      <label><input type="checkbox" id="semLactose"> Sem lactose</label>
      <label><input type="checkbox" id="semGluten"> Sem glúten</label>
    </div>

    <button type="button" id="criarConta">Criar conta</button>

    <p class="link">Já tem conta? <a href="login.html">Entrar</a></p>
  </div>

  <script src="js/cadastro.js"></script>
</body>
</html>
