<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detalhes da receita — Receitas em Casa</title>
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>

  <div class="receita-detalhe">

    <a href="index.html" class="voltar">← Voltar</a>

    <div class="foto-grande" id="fotoReceita"></div>

    <h1 id="nomeReceita">Carregando receita...</h1>
    <p class="meta" id="metaReceita"></p>

    <h3>Ingredientes</h3>
    <ul id="ingredientesReceita"></ul>

    <h3>Modo de preparo</h3>
    <ol id="preparoReceita"></ol>

    <div class="acoes">
      <button id="btnFavoritar" type="button">♡ Favoritar</button>
    </div>

    <div style="margin-top: 16px;">
      <p style="font-size: 13px; color: #8A7A68; margin-bottom: 8px;">Avaliar esta receita:</p>
      <div class="estrelas" id="estrelas">
        <span data-valor="1">★</span>
        <span data-valor="2">★</span>
        <span data-valor="3">★</span>
        <span data-valor="4">★</span>
        <span data-valor="5">★</span>
      </div>
      <button type="button" id="btnSalvarAvaliacao" style="width: auto; margin-top: 12px; padding: 8px 16px;">Salvar avaliação</button>
      <p id="msgAvaliacao" style="font-size: 13px; color: #8A7A68; margin-top: 8px;"></p>
    </div>

  </div>

  <script src="js/dados.js"></script>
  <script src="js/favoritos-helper.js"></script>
  <script src="js/detalhe.js?v=3"></script>
</body>
</html>
