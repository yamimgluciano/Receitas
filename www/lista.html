<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Receitas — Receitas em Casa</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="pagina-inicial">

    <a href="index.html" class="voltar">← Voltar</a>

    <h2 class="secao-titulo">Todas as receitas</h2>

    <input type="text" id="busca" class="busca" placeholder="Pesquisar receita...">

    <select id="filtroCategoria" class="filtro">
      <option value="todos">Todas as categorias</option>
      <option value="cafe">Café</option>
      <option value="almoco">Almoço</option>
      <option value="janta">Janta</option>
      <option value="lanche">Lanche</option>
      <option value="sobremesa">Sobremesa</option>
    </select>

    <!-- os cards são gerados pelo js/lista.js a partir de js/dados.js -->
    <div class="grid-receitas" id="listaReceitas"></div>

  </div>

  <script src="js/dados.js"></script>
  <script src="js/favoritos-helper.js"></script>
  <script src="js/lista.js"></script>
</body>
</html>
