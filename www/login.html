<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Receitas em Casa</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="card">
    <h1>🍲 Receitas em Casa</h1>
    <p class="subtitle">Entre para ver suas receitas salvas</p>

    <!-- Tela simulada: não valida usuário/senha de verdade,
         só navega para a página inicial como se o login tivesse funcionado -->
    <label for="email">E-mail</label>
    <input type="email" id="email" placeholder="seuemail@exemplo.com">

    <label for="senha">Senha</label>
    <input type="password" id="senha" placeholder="Sua senha">

    <button type="button" id="entrar">Entrar</button>
    <p class="erro" id="mensagemErro" style="text-align: center;"></p>

    <p class="link">Não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
